bundle:
  name: "mcp-dqx"
  # Deploy without Terraform. The direct engine avoids the `terraform init` provider download
  # from registry.terraform.io (blocked on some networks/CI runners). Requires Databricks CLI
  # 0.279.0+. See https://docs.databricks.com/aws/en/dev-tools/bundles/direct
  engine: direct

variables:
  users_group:
    description: "Group name for all workspace users (e.g. 'account users' or 'users')"
    default: "account users"
  # Resource name prefix. Override (e.g. --var name_prefix=mcp-dqx-ci) to deploy an
  # isolated copy alongside an existing deployment — used by the CI integration workflow.
  name_prefix:
    default: "mcp-dqx"
  # Catalog the bundle creates its schema + volumes in, and where per-user output schemas live.
  # REQUIRED at deploy time: the resource definitions below build UC names from it, so an empty
  # value produces invalid identifiers. It is injected into the app as the DQX_CATALOG config env
  # value (no secret scope — a catalog name isn't sensitive; UC grants govern access).
  # Pass e.g. --var catalog_name=<catalog> (or CATALOG=<catalog> via make mcp-deploy).
  # The placeholder default keeps the bundle syntactically valid but every real deploy must override it.
  catalog_name:
    default: ""
  # Schema (in catalog_name) holding the temp views, the results volume, and the runner-wheel volume.
  # A variable rather than a constant so concurrent deploys can be fully isolated — CI passes a
  # per-run value. NOTE: schema identifiers cannot contain '-', so a caller deriving this from
  # name_prefix must sanitise it (see scripts/ci_deploy.sh).
  tmp_schema_name:
    default: "dqx_mcp_tmp"
  # Application ID of the **dedicated workspace service principal** the runner job runs as.
  # This is NOT the app's auto-created SP — an app-scoped SP cannot be a job run_as identity,
  # so a separate workspace SP is required (see the "Runner service principal" section of the DQX
  # MCP Server installation docs). The placeholder
  # default keeps the bundle syntactically valid; every real deploy MUST override it, e.g.
  #   databricks bundle deploy --var runner_service_principal_id=<app-id-of-the-runner-sp>
  # The deploying identity needs the "Service Principal: User" role on this SP (admins have it
  # implicitly) or `bundle deploy` fails with "User is not authorized to use this service principal".
  runner_service_principal_id:
    default: "00000000-0000-0000-0000-000000000000"
  # Filename of the runner wheel the app publishes to the wheels volume and the runner job installs.
  # It carries the version from runner/pyproject.toml, so the two must be bumped together — a unit
  # test asserts they match, and the app logs a warning at startup if the built wheel differs.
  runner_wheel_filename:
    default: "dqx_mcp_runner-0.1.0-py3-none-any.whl"

# Deliberately NO workspace.artifact_path. `bundle deploy` uploads artifacts BEFORE it creates
# resources, so a volume named as artifact_path can never be bundle-managed — it has to pre-exist,
# which is why this used to need scripts/ensure_artifacts_volume.sh. Instead the app publishes the
# runner wheel to the bundle-managed wheels volume at startup (see server/bootstrap.py) and the
# runner job installs it from that absolute /Volumes path, so every UC object here is owned by the
# bundle and carries native `grants:` — mirroring the DQX Studio app.
workspace:
  # Scoped by name_prefix so concurrent deploys (e.g. two PRs' CI runs, each with a unique
  # name_prefix) never share bundle state. Without this the CLI's default root_path
  # (.../.bundle/mcp-dqx/dev) is identical across runs by the same deployer, so parallel
  # `bundle deploy`s race on the state file. A normal `make mcp-deploy` leaves name_prefix at its
  # default ("mcp-dqx"), so the path stays stable and predictable.
  root_path: "/Workspace/Users/${workspace.current_user.userName}/.bundle/${var.name_prefix}/${bundle.target}"

resources:
  # UC objects the bundle OWNS, so their grants are declared natively here and applied by
  # `bundle deploy` — no post-deploy notebook job, and no runtime `ws.apps.get()` lookup, because the
  # app's service principal is referenceable as ${resources.apps.mcp-dqx.service_principal_client_id}.
  # Mirrors the DQX Studio bundle.
  #
  # Catalog-level grants (USE CATALOG for everyone, and CREATE SCHEMA for the runner SP, which needs
  # it to create per-user dqx_mcp_<user> output schemas) are deliberately NOT declared here. They are
  # applied once per catalog by scripts/grant_catalog_prereqs.sh — see the MCP section of
  # docs/dqx/docs/installation.mdx.
  #
  # `resources.catalogs` does support `grants`, and declaring the catalog here WOULD work — but only
  # after `bundle deployment bind`, because a catalog that already exists otherwise fails the deploy
  # with CATALOG_ALREADY_EXISTS. Both routes were tested and rejected:
  #   - bound WITHOUT lifecycle.prevent_destroy: `bundle destroy` deletes the customer's catalog and
  #     everything in it. catalog_name is a free variable, so that could be `main`.
  #   - bound WITH prevent_destroy: the catalog is safe, but `bundle destroy` then aborts entirely
  #     (0 resources removed), so teardown would need an unbind step first and would no longer be one
  #     command.
  # A single documented grant command is the better trade, and matches the DQX Studio app, which also
  # documents USE CATALOG as a prerequisite rather than binding the catalog.
  schemas:
    tmp_schema:
      catalog_name: ${var.catalog_name}
      name: ${var.tmp_schema_name}
      comment: "DQX MCP server: temp views, results volume, and runner-wheel volume."
      grants:
        # Users create definer's-rights temp views here through their own OBO token.
        - principal: ${var.users_group}
          privileges: [USE_SCHEMA, CREATE_TABLE]
        # The app reads through those views and drops stale ones (the in-app sweeper).
        - principal: ${resources.apps.mcp-dqx.service_principal_client_id}
          privileges: [USE_SCHEMA, SELECT, MODIFY]
        # The runner job reads the views and writes results as its own least-privilege identity.
        - principal: ${var.runner_service_principal_id}
          privileges: [USE_SCHEMA, SELECT, MODIFY]
  volumes:
    # Result files (<run_id>.json) plus staged job inputs, written by the runner and read by the app.
    mcp_results:
      catalog_name: ${var.catalog_name}
      schema_name: ${resources.schemas.tmp_schema.name}
      name: mcp_results
      volume_type: MANAGED
      comment: "DQX MCP server: runner result files and staged job inputs."
      grants:
        - principal: ${resources.apps.mcp-dqx.service_principal_client_id}
          privileges: [READ_VOLUME, WRITE_VOLUME]
        - principal: ${var.runner_service_principal_id}
          privileges: [READ_VOLUME, WRITE_VOLUME]
    # The runner wheel the app publishes at startup; the runner job installs it from here by
    # absolute path (see the job's `dependencies`), so the runner SP only needs read access.
    dqx_artifacts:
      catalog_name: ${var.catalog_name}
      schema_name: ${resources.schemas.tmp_schema.name}
      name: dqx_artifacts
      volume_type: MANAGED
      comment: "DQX MCP server: runner wheel published by the app at startup."
      grants:
        - principal: ${resources.apps.mcp-dqx.service_principal_client_id}
          privileges: [READ_VOLUME, WRITE_VOLUME]
        - principal: ${var.runner_service_principal_id}
          privileges: [READ_VOLUME]

  jobs:
    dqx_runner:
      name: "${var.name_prefix}-runner"
      max_concurrent_runs: 10
      # Run the per-request data job as a dedicated, least-privilege workspace SP — NOT the
      # deploying user. Otherwise every caller's job would execute with the deployer's (often
      # admin) permissions on the non-view paths (file reads, output writes). Source-table reads
      # stay governed by the caller via definer's-rights views regardless of this identity.
      run_as:
        service_principal_name: ${var.runner_service_principal_id}
      tasks:
        # A python_wheel_task (not a notebook_task): the job runs as the dedicated runner SP, and
        # the runner is a proper unit-testable package (mirrors the DQX Studio task runner). The
        # run_as SP reads the wheel from the bundle-managed dqx_artifacts volume, which grants it
        # READ_VOLUME natively (see resources.volumes.dqx_artifacts). The entry point writes its
        # JSON result to the results UC volume keyed by {{job.run_id}}; the app reads it back.
        - task_key: dqx_run
          python_wheel_task:
            package_name: dqx_mcp_runner
            entry_point: dqx-mcp-runner
            parameters:
              - "--operation"
              - "{{job.parameters.operation}}"
              - "--params"
              - "{{job.parameters.params}}"
              - "--results-volume"
              - "{{job.parameters.results_volume}}"
              - "--run-id"
              - "{{job.run_id}}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              # The runner wheel, installed from the bundle-managed wheels volume by ABSOLUTE path.
              # The app publishes it there at startup (server/bootstrap.py) rather than the bundle
              # uploading it to workspace.artifact_path — that is what lets every UC object here be
              # bundle-managed with native grants (see the comment above `workspace:`). The version
              # is pinned via var.runner_wheel_filename and must track runner/pyproject.toml; a unit
              # test asserts they match and the app warns at startup if the built wheel differs.
              - "/Volumes/${var.catalog_name}/${var.tmp_schema_name}/dqx_artifacts/${var.runner_wheel_filename}"
              # A PINNED, published DQX release from the registry (mirrors the DQX Studio task
              # runner, which also pins databricks-labs-dqx==<version>). Keep this version in sync
              # with the repo's current release; bump it when upgrading DQX. The [datacontract] extra
              # can be applied here because this is a PyPI spec, not a wheel path.
              #
              # The [llm] extra (dspy) is intentionally NOT installed — the runner stays lean and
              # deterministic, mirroring the DQX Studio task runner. As a result the
              # generate_rules_from_contract tool is deterministic-only: it does not process the
              # contract's free-text expectations (DQX's LLM "text rules" path). Enabling that is a
              # follow-up: add the dspy/litellm deps from the DQX [llm] extra here, plumb an LLM
              # endpoint config through to the runner, and re-expose the parameter in server/tools.py.
              - databricks-labs-dqx[datacontract]==0.15.0
      parameters:
        - name: operation
          default: ""
        - name: params
          default: "{}"
        # Full UC-volume path for result files, e.g. /Volumes/<catalog>/dqx_mcp_tmp/mcp_results. The app
        # sets this per-submit from its catalog config; the runner writes <run_id>.json there.
        - name: results_volume
          default: ""
        # Email of the user who submitted this run (from the OBO X-Forwarded-Email header). Not read
        # by the runner — it's recorded on the run so get_run_result can authorize the reader: only
        # the submitter may fetch a run's result (results can contain their governed source data).
        - name: requesting_user
          default: ""
      # Declared natively so `bundle deploy` applies it: the app submits runs and polls results, so
      # it needs CAN_MANAGE_RUN — and deliberately NOT CAN_MANAGE, which would let the app SP rewrite
      # the job definition (including its run_as) and so escape the least-privilege boundary the
      # dedicated runner SP exists to enforce. The app never modifies the job: the runner wheel is
      # installed from a fixed volume path (see `dependencies` above), so nothing needs jobs.update.
      # This replaces the explicit ws.jobs.update_permissions() call the old setup job made because
      # the app→job resource binding alone did not reliably land the grant in the job ACL.
      permissions:
        - level: CAN_MANAGE_RUN
          service_principal_name: ${resources.apps.mcp-dqx.service_principal_client_id}

  apps:
    mcp-dqx:
      name: "${var.name_prefix}"
      description: "DQX MCP Server - AI agent tools for data quality checks"
      source_code_path: "."

      user_api_scopes:
        - sql
        - files
        # 'workspace.workspace' lets the user's OBO token read/stat/write workspace-file paths
        # (e.g. a contract or checks YAML under /Workspace or /Users). Without it the OBO
        # read/write pre-checks for workspace-file backends fail with 403 "Invalid scope".
        - workspace.workspace

      # App runtime config lives here (not a static app.yaml) so bundle variables interpolate into
      # it at deploy time — mirrors the DQX Studio bundle. This replaces app.yaml (which cannot
      # reference ${var.*}).
      config:
        command: ["python", "server/main.py"]
        env:
          # DQX_CATALOG is a plain (non-secret) value: a Unity Catalog *name* is not sensitive —
          # access is governed by UC grants, not by hiding the name — so it does not belong in a
          # secret scope. It is set at deploy time from the catalog_name bundle var (the same value
          # used for the artifacts-volume path), so there is nothing to configure out-of-band.
          - name: DQX_CATALOG
            value: "${var.catalog_name}"
          - name: DQX_TMP_SCHEMA
            value: "${var.tmp_schema_name}"
          # Resource-backed: the runner job id comes from the app→job binding below.
          - name: DQX_RUNNER_JOB_ID
            value_from: "dqx-runner-job"
          # Where the app publishes the runner wheel at startup, and the exact filename the runner
          # job expects there (see server/bootstrap.py and the job's dependencies above).
          - name: DQX_WHEELS_VOLUME
            value: "/Volumes/${var.catalog_name}/${var.tmp_schema_name}/dqx_artifacts"
          - name: DQX_RUNNER_WHEEL_FILENAME
            value: "${var.runner_wheel_filename}"

      resources:
        - name: dqx-runner-job
          job:
            id: ${resources.jobs.dqx_runner.id}
            permission: "CAN_MANAGE_RUN"

      permissions:
        - level: CAN_USE
          group_name: ${var.users_group}

sync:
  include:
    # The built runner wheel rides along as app source code, so the app can publish it to the
    # wheels volume at startup (server/bootstrap.py). ("notebooks/**" is gone with the setup job.)
    - ".build/**"

# Build only the MCP runner wheel (this sub-project's ./runner). DQX is a pinned published release
# installed from the registry by the runner job's environment spec — not built from source here.
artifacts:
  # Only the runner wheel (this sub-project) is built locally. DQX itself is a PINNED published
  # release installed from the registry at job-environment install time (see the runner job's
  # environment dependencies above) — mirroring the DQX Studio task runner, which also pins
  # databricks-labs-dqx from the registry rather than building the parent wheel from source.
  dqx_mcp_runner_wheel:
    build: uv build ./runner --wheel --out-dir ./.build

targets:
  dev:
    default: true
