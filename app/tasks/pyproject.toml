[project]
name = "databricks-labs-dqx-task-runner"
version = "0.1.2"
description = "Serverless task runner for DQX Studio — executes profiler and dry-run jobs on Databricks compute"
requires-python = ">=3.12"
dependencies = [
    # Unpinned here for lint/dev; build_app.py pins it to dqx_version in the release wheel.
    "databricks-labs-dqx",
    "databricks-sdk~=0.120",
]

[project.scripts]
dqx-task-runner = "dqx_task_runner.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dqx_task_runner"]
