codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5% # The minimum coverage threshold for the project
    patch:
      default:
        target: auto
        threshold: 0.5% # The minimum coverage threshold for the patch

# PRs only run the test suites of the boundaries they change (see .github/scripts/changed-boundaries.sh),
# so a flag that was not uploaded keeps its last known coverage instead of dropping out of the report.
flag_management:
  default_rules:
    carryforward: true

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 0.5%
      - type: patch
        target: auto
        threshold: 0.5% # The minimum coverage threshold for the patch

  individual_components:
    - component_id: core
      name: dqx-core
      paths:
        - src/**
    - component_id: mcp_server
      name: dqx-mcp-server
      paths:
        - mcp-server/**
      statuses:
        - type: project
          target: auto
          threshold: 2.0%
    - component_id: app
      name: dqx-app
      paths:
        - app/src/**
