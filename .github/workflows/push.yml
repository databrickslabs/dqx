name: build

on:
  pull_request:
    types: [opened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    # Always run on push to main. The build cache can only be reused
    # if it was saved by a run from the repository's default branch.
    # The run result will be identical to that from the merge queue
    # because the commit is identical, yet we need to perform it to
    # seed the build cache.
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  not-a-fork:
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    steps:
      - run: echo "Not a fork PR, proceeding"

  ci:
    # Gated per-step via `env.RUN_UNIT` so the matrix expands and each leaf (ci (3.10),
    # ci (3.11), ci (3.12)) reports its own check. A job-level `if:` skips the job before
    # matrix expansion and emits only a single `ci` check, leaving the required `ci (X.Y)`
    # contexts in "Expected — Waiting for status to be reported". Fork PRs get no
    # boundaries from `changes`, so their steps are skipped too. The anomaly boundary runs
    # the unit suite because its unit tests (tests/unit/test_anomaly_*) live there.
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        pyVersion: [ '3.10', '3.11', '3.12' ]
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    permissions:
      id-token: write
    env:
      UV_PYTHON: ${{ matrix.pyVersion }}
      RUN_UNIT: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.anomaly == 'true' }}
    steps:
      - name: Checkout
        if: env.RUN_UNIT == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup environment
        if: env.RUN_UNIT == 'true'
        uses: ./.github/actions/setup-env

      - name: Run unit tests
        if: env.RUN_UNIT == 'true'
        env:
          # Lets the watchdog's SIGABRT print a stack for every thread of every process.
          PYTHONFAULTHANDLER: "1"
        run: |
          # This step has hung *after* the last test completed, inside pytest-xdist's session
          # teardown. No pytest timeout covers that phase (--timeout only guards a test's
          # setup/call/teardown), so the job emitted minutes of silence and then died on the
          # runner's shutdown signal with nothing to debug. Abort before the runner reclaims the
          # VM instead, so faulthandler shows where each thread is parked. The budget has to
          # clear a normal run (dependency sync dominates, tests are ~1min) while still landing
          # before the shutdown signal.
          ( sleep 480
            echo "::error::unit tests still running after 8m - dumping thread stacks"
            pkill -ABRT -f '[p]ython'
          ) &
          watchdog=$!
          trap 'kill "$watchdog" 2>/dev/null || true' EXIT
          make test

      - name: Publish unit test coverage
        # 3.12 only to avoid duplicate uploads.
        # Skip on `push: main` — main-branch coverage is published by nightly.yml which
        # runs the full test set (unit + integration + anomaly + e2e). Publishing only
        # unit coverage here would overwrite codecov's main baseline with a lower number.
        if: env.RUN_UNIT == 'true' && matrix.pyVersion == '3.12' && github.event_name != 'push'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          use_oidc: true
          flags: unit

  # Not gated: fmt/lint covers every boundary (black and ruff also run over app/ and mcp-server/).
  fmt:
    needs: not-a-fork
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Format all files
        run: make dev fmt

      - name: Fail on differences
        run: git diff --exit-code

  docs:
    needs: [not-a-fork, changes]
    if: needs.changes.outputs.docs == 'true'
    name: Build Docusaurus
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: docs/dqx/yarn.lock # need to put the lockfile path explicitly

      - name: Install dependencies
        run: make docs-install

      - name: Build website
        run: make docs-build

      - name: Validate skills manifest
        run: make test-skills

  app:
    needs: [not-a-fork, changes]
    if: needs.changes.outputs.studio == 'true'
    name: Build and Check App
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/yarn.lock

      - name: Install Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: "1.3.11"

      - name: Install JavaScript dependencies
        run: make app-install
        working-directory: .

      - name: Build app
        run: make app-build
        working-directory: .

      - name: Run TypeScript and Python checks
        run: make app-check
        working-directory: .

      - name: Verify Marketplace package
        run: make app-check-marketplace
        working-directory: .

      - name: Run app backend tests
        run: make app-test
        working-directory: .

  mcp:
    needs: [not-a-fork, changes]
    if: needs.changes.outputs.mcp == 'true'
    name: Build and Check MCP Server
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    permissions:
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Type-check MCP server
        run: make mcp-check

      - name: Run MCP server tests
        run: make mcp-test

  # Single stable check for branch protection: passes when every job above passed or was
  # skipped because its boundary did not change.
  summary:
    needs: [changes, ci, fmt, docs, app, mcp]
    if: always()
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
